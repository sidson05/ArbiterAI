services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: insurance_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance_claims
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurance_claims"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
