[project]
name = "insurance-claims-agentic-rag"
version = "0.1.0"
description = "Production Agentic RAG System for Insurance Claims Adjudication with LangGraph, MCP, pgvector, and Evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.40",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.5",
    "langchain-anthropic>=0.2.4",
    "langchain-google-genai>=2.0.4",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "langfuse>=2.53.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
